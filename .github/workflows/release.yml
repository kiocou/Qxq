name: Release CI
run-name: Release CI (${{ github.event_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example v1.0.0); leave empty to increment patch"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.version.outputs.tag }}
      app_semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"

          if [[ -n "$REQUESTED_VERSION" ]]; then
            tag="$REQUESTED_VERSION"
          else
            reusable_tag="$(
              jq -r --arg sha "$GITHUB_SHA" \
                '.[] | select(.draft == true and .target_commitish == $sha) | .tag_name' \
                <<< "$releases_json" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
            if [[ -n "$reusable_tag" ]]; then
              tag="$reusable_tag"
            else
              latest="$(
                {
                  git tag --list
                  jq -r '.[].tag_name' <<< "$releases_json"
                } \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -Vu \
                  | tail -n 1 \
                  || true
              )"
              if [[ -z "$latest" ]]; then
                tag="v0.1.0"
              else
                IFS=. read -r major minor patch <<< "${latest#v}"
                tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$tag'; expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

          existing_release="$(jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' <<< "$releases_json" | head -n 1)"
          if [[ -n "$existing_release" ]]; then
            is_draft="$(jq -r '.draft' <<< "$existing_release")"
            target_commitish="$(jq -r '.target_commitish' <<< "$existing_release")"
            if [[ "$is_draft" == "true" && "$target_commitish" == "$GITHUB_SHA" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release $tag already exists for '$target_commitish' and cannot be safely reused for '$GITHUB_SHA'"
              exit 1
            fi
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Create draft GitHub Release
        if: steps.version.outputs.reuse != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "Qxq $TAG_NAME"

  build-app:
    name: Build ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            variant: standard
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            variant: standard
          - label: Windows standard
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: standard
          - label: Windows WebView2 runtime
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: webview
          - label: Windows offline
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            variant: offline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Yarn
        run: npm install --global yarn

      - name: Prepare Excalidraw
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch custom/master https://github.com/mg-chao/excalidraw.git ../excalidraw
          yarn --cwd ../excalidraw install --frozen-lockfile
          yarn --cwd ../excalidraw build:packages

      - name: Configure online mode
        shell: bash
        run: |
          if [[ "${{ matrix.variant }}" == "offline" ]]; then
            echo "PUBLIC_ONLINE_STATUS=false" > .env
          else
            echo "PUBLIC_ONLINE_STATUS=true" > .env
          fi

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Add offline QR dependency
        if: matrix.variant == 'offline'
        run: pnpm install qr-scanner-wechat@0.1.3

      - name: Disable updater artifacts for offline package
        if: matrix.variant == 'offline'
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "src-tauri/tauri.windows.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          '

      - name: Download ONNX Runtime for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/supertone-inc/onnxruntime-build/releases/download/v1.22.2/onnxruntime-win-x64-static_lib-1.22.2.zip" -OutFile "onnxruntime.zip"
          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "onnxruntime-temp" -Force
          $libPath = Get-ChildItem -Path "onnxruntime-temp" -Recurse -Directory -Filter "lib" | Select-Object -First 1
          if (-not $libPath) { throw "ONNX Runtime lib directory was not found" }
          Copy-Item -Path $libPath.FullName -Destination "src-tauri\lib" -Recurse -Force

      - name: Download offline resources
        if: runner.os == 'Windows' && matrix.variant == 'offline'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/mg-chao/snow-shot-webview-runtime/releases/download/Resources_20251107/npm.zip" -OutFile "npm.zip"
          Expand-Archive -Path "npm.zip" -DestinationPath "public" -Force
          Remove-Item -Path "public\npm\qr-scanner-wechat" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download WebView2 fixed runtime
        if: runner.os == 'Windows' && matrix.variant == 'webview'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeVersion = "141.0.3537.99"
          $cabFile = "Microsoft.WebView2.FixedVersionRuntime.$runtimeVersion.x64.cab"
          Invoke-WebRequest -Uri "https://github.com/mg-chao/snow-shot-webview-runtime/releases/download/v141.0.3537.99/$cabFile" -OutFile $cabFile
          $targetDir = ".\src-tauri\Microsoft.WebView2.FixedVersionRuntime.$runtimeVersion.x64"
          New-Item -Path $targetDir -ItemType Directory -Force | Out-Null
          Expand -F:* $cabFile $targetDir
          Move-Item -Path ".\src-tauri\webview2.x64.json" -Destination ".\src-tauri\tauri.windows.conf.json" -Force

      - name: Download ONNX Runtime for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output onnxruntime.tgz "https://github.com/supertone-inc/onnxruntime-build/releases/download/v1.22.2/onnxruntime-osx-universal2-static_lib-1.22.2.tgz"
          mkdir -p onnxruntime-temp
          tar -xzf onnxruntime.tgz -C onnxruntime-temp
          lib_path="$(find onnxruntime-temp -type d -name lib -print -quit)"
          test -n "$lib_path"
          cp -R "$lib_path" src-tauri/lib

      - name: Configure macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "PKG_CONFIG_ALL_STATIC=1" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=12.3" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          brew install xz

      - name: Select release asset name
        id: asset
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            webview) echo "pattern=Qxq_[version]_[platform]-[arch]_webview[_setup][ext]" >> "$GITHUB_OUTPUT" ;;
            offline) echo "pattern=Qxq_[version]_[platform]-[arch]_offline[_setup][ext]" >> "$GITHUB_OUTPUT" ;;
            *) echo "pattern=Qxq_[version]_[platform]-[arch][_setup][ext]" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and upload package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.app_version }}
          releaseName: Qxq ${{ needs.create-release.outputs.app_version }}
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: ${{ steps.asset.outputs.pattern }}
          uploadUpdaterJson: ${{ runner.os == 'Windows' && matrix.variant == 'standard' }}
          uploadUpdaterSignatures: ${{ runner.os == 'Windows' && matrix.variant == 'standard' }}
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --config {"version":"${{ needs.create-release.outputs.app_semver }}"}

  publish-release:
    name: Validate and publish release
    needs: [create-release, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.create-release.outputs.app_version }}
      SEMVER: ${{ needs.create-release.outputs.app_semver }}
    steps:
      - name: Validate release assets and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          standard="Qxq_${SEMVER}_windows-x64_setup.exe"
          grep -Fxq "$standard" <<< "$assets"
          grep -Fxq "${standard}.sig" <<< "$assets"
          grep -Fxq "latest.json" <<< "$assets"

          mkdir release-check
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-check
          jq -e --arg version "$SEMVER" --arg suffix "/$standard" '
            .version == $version and
            (.platforms["windows-x86_64"].signature | length > 0) and
            (.platforms["windows-x86_64"].url | endswith($suffix))
          ' release-check/latest.json >/dev/null

      - name: Publish release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Windows 下载

          - 推荐大多数用户下载名称以 `_windows-x64_setup.exe` 结尾的标准安装包。
          - `_webview_setup.exe` 内置 WebView2，安装包更大，适合系统 WebView2 异常时使用。
          - `_offline_setup.exe` 包含离线资源，适合受限网络环境。

          自动更新清单和签名已在发布前完成校验。
          EOF
          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "Qxq $TAG_NAME" \
            --notes-file release-notes.md
